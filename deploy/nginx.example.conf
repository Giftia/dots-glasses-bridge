# EXAMPLE ONLY. Review and merge into your existing HTTPS server block.
# Keep the installation OUTSIDE every nginx root/alias directory.
# Provision your own hostname, certificate and TLS configuration separately.
# Upstream port must match the generated config (default 17326).

location = /.well-known/oauth-authorization-server/dots {
    proxy_pass http://127.0.0.1:17326;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /.well-known/oauth-protected-resource/dots/mcp {
    proxy_pass http://127.0.0.1:17326;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location ^~ /dots/ {
    # No URI suffix: retain /dots/... when forwarding.
    proxy_pass http://127.0.0.1:17326;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 90s;
    client_max_body_size 8m;
}
# Defense in depth. No runtime files should be in the web document tree.
location ~ /\.dot-events(?:/|$) { return 404; }
